name: incident-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentdb}
      POSTGRES_USER: ${POSTGRES_USER:-incident_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_user} -d ${POSTGRES_DB:-incidentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Note: The db service doesn't expose a port, because nothing outside the app_internal network needs to talk to the database — and exposing it would be a security risk with zero benefit.
  # Without ports: the container is still reachable from other containers on the same Docker network — just not from the host or the outside world.
  # The db service is only reachable from other containers on the app_internal network, which is a private network that only the incident-app stack knows about.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production  # The backend service is running in production mode, which means it's optimized for performance and doesn't include development tools like webpack.
      PORT: 5000  # The backend service listens on port 5000 for incoming HTTP requests. This is the port that the frontend service will use to communicate with the backend.
      DB_HOST: db # The backend service connects to the db service using the hostname db, which is the name of the db service in this Docker Compose file. Docker Compose automatically creates a DNS entry for each service, so other services can reach it by its name.
      DB_PORT: 5432 # The backend service connects to the db service on port 5432, which is the default port for PostgreSQL. This is the port that the db service is listening on inside its container.
      DB_NAME: ${POSTGRES_DB:-incidentdb}
      DB_USER: ${POSTGRES_USER:-incident_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_internal
      - observability
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file # for the backend service, the logging driver is set to json-file, which means that logs will be written in JSON format to a file on the host machine. This allows for structured logging and easier parsing of log data.
      options:
        max-size: "10m" # maximum size of the log file before it is rotated. In this case, the log file will be rotated when it reaches 10 megabytes in size.
        max-file: "3" # maximum number of log files to keep. In this case, Docker will keep up to 3 rotated log files in addition to the current log file. When the maximum number of log files is reached, the oldest log file will be deleted to make room for new logs.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80" # maps port 80 on the host machine to port 80 on the container
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file 
      options:
        max-size: "10m" 
        max-file: "3" 

volumes:
  postgres_data:  # volume for storing the PostgreSQL database data

networks:
  app_internal: # internal network for the app so that the db, backend, and frontend services can communicate with each other without exposing them to the outside world.
    driver: bridge
  observability:
    external: true
    name: incident-observability  # backend (service from current/app compose file) and prometheus (service from monitoring compose file) are on the same network so prometheus can scrape metrics from backend
